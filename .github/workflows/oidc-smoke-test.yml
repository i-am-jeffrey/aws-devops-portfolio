# Place this file at: .github/workflows/oidc-smoke-test.yml
#
# One job, one purpose: prove the GitHub->AWS OIDC trust for the BUILD
# role actually works, in isolation from everything else. Delete this
# file once secure-ci.yml exists and has proven the same thing itself.

name: oidc-smoke-test

on:
  workflow_dispatch:   # manual trigger only -- never runs on push, so it's safe to leave sitting in the repo

permissions:
  id-token: write
  contents: read

jobs:
  test-build-role:
    runs-on: ubuntu-latest
    steps:
      - name: Assume the build role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::411714852651:role/segment1-app-gha-build
          aws-region: ap-southeast-1

      - name: Confirm which identity AWS actually granted
        run: aws sts get-caller-identity
