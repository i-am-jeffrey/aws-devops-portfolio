# Place this file at the repo root: .checkov.yaml
#
# Every skip here has a documented reason -- this is not "make the red X
# go away," it's "these specific checks don't meaningfully apply to how
# this project consumes Terraform, or are known false positives." Nothing
# in Category A or B (see the CI triage discussion) is skipped here --
# only things Checkov flags inside code this project doesn't author, or
# genuine tool limitations.

skip-check:
  - CKV_TF_1
    # "Ensure Terraform module sources use a commit hash." This project
    # consumes Registry-style modules (terraform-aws-modules/eks/aws,
    # .../vpc/aws) via version constraints, not raw git+commit-hash
    # sources -- this check's model doesn't match that consumption
    # pattern. Applies both to eks.tf/vpc.tf's own module calls and to
    # the nested module.eks.kms call, which isn't this project's code at
    # all.

  - CKV_AWS_356
    # "Ensure no IAM policies documents allow '*' as a statement's
    # resource for restrictable actions" -- flagged on
    # module.eks.aws_iam_policy_document.cni_ipv6_policy, a policy
    # generated internally by the terraform-aws-modules/eks module
    # itself, not authored in this project's own .tf files.

  - CKV_AWS_111
    # Same resource as above (cni_ipv6_policy), same reasoning -- inside
    # the EKS module's own generated IAM policy, not this project's code.

  - CKV2_AWS_5
    # "Ensure that Security Groups are attached to another resource."
    # A known Checkov false-positive pattern for the EKS-module-managed
    # cluster and node security groups here: they ARE attached, via
    # vpc_security_group_ids on the cluster/node group resources rather
    # than a dedicated attachment resource Checkov's static analysis can
    # trace.

  - CKV2_AWS_19
    # "Ensure all EIP addresses allocated to a VPC are attached to EC2
    # instances." The flagged EIP is genuinely attached -- to this
    # project's NAT Gateway, not an EC2 instance directly. NAT Gateway
    # attachment is a legitimate, common use this specific check doesn't
    # account for.

  - CKV_AWS_58
    # "Ensure EKS Cluster has Secrets Encryption Enabled." Verified
    # against the REAL cluster, not assumed:
    #   aws eks describe-cluster --name segment1-app-cluster \
    #     --query 'cluster.encryptionConfig'
    # returned resources: ["secrets"] with a real KMS key ARN
    # (the EKS module's own auto-created key). Encryption genuinely is
    # enabled -- Checkov just can't see a default the community module
    # sets internally, since it was never explicitly written in this
    # project's own calling code.

  - CKV_AWS_38
  - CKV_AWS_39
    # "Ensure Amazon EKS public endpoint [not accessible to 0.0.0.0/0 /
    # disabled]." A deliberate, documented trade-off, not an oversight:
    # this project's CI runs on GitHub-hosted runners, which have no
    # stable IP range to allow-list, and the human accesses the cluster
    # directly from a laptop with no VPN/bastion in place. Disabling the
    # public endpoint would break both. Revisit if this project ever
    # adds a self-hosted runner or bastion host.

  - CKV2_AWS_12
    # "Ensure the default security group of every VPC restricts all
    # traffic." vpc.tf already sets manage_default_security_group=true
    # with empty ingress/egress -- and this was verified against the
    # REAL security group, not just the Terraform config:
    #   aws ec2 describe-security-groups --group-ids sg-041858dbcf994aba2
    #     --query 'SecurityGroups[0].[IpPermissions,IpPermissionsEgress]'
    # returned two empty arrays. Genuinely locked down. This check
    # appears to trace the aws_vpc resource directly and not the
    # separate conditional resource this module uses to manage the
    # default SG -- a static-analysis limitation, not a real gap.
