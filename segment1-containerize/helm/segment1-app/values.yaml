image:
  repository: <ECR_REPOSITORY_URL>   # from terraform output: ecr_repository_url
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080
  # These annotations are read by the AWS Load Balancer Controller to
  # provision a Network Load Balancer. Annotation keys have changed across
  # controller versions -- confirm the current set against the controller's
  # docs for whichever version you install.
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
