# Place this file at: .github/workflows/secure-ci.yml
#
# STEP 1 OF 3 -- fixed version. Changes from the first attempt:
#   1. actions/checkout bumped v4 -> v6 (drops the Node.js 20 warning;
#      note: GitHub's own docs disagree with each other on v5 vs v6 --
#      the GHEC-specific docs page shows v5, the main github.com docs
#      page shows v6. Went with v6 as the one targeting github.com
#      itself, but flagging the disagreement rather than hiding it.)
#   2. github/codeql-action/upload-sarif bumped v3 -> v4 (v3 logs a
#      deprecation warning as of this writing; deprecated outright
#      December 2026)
#   3. All three scan steps now capture their tool's real exit code,
#      ALWAYS attempt to produce/rename the SARIF report regardless of
#      that code, and only then fail the step deliberately.
#   4. All three scan steps (not just their Upload counterparts) now
#      have `if: always()`. Without this, GitHub Actions' default
#      behavior skips every step after the first failure in a job --
#      so Semgrep finding real issues and failing was silently
#      preventing Checkov from ever running at all. This was the actual
#      root cause of "checkov.sarif missing" -- not a filename guess
#      problem, a step-skipping problem. Each scanner should run
#      independently of whether an earlier one found something; only
#      the job's overall pass/fail should reflect all three combined.
#   5. All five third-party actions across both jobs are now pinned to
#      real, confirmed commit SHAs (not floating version tags) --
#      actions/checkout, aws-actions/configure-aws-credentials,
#      aws-actions/amazon-ecr-login, github/codeql-action, and
#      sigstore/cosign-installer. Each SHA was taken directly from a
#      real GitHub Actions "Set up job" log for this repo, not guessed
#      or sourced from a web search -- the two that needed
#      build-scan-sign-push to actually run first (ecr-login,
#      cosign-installer) were temporarily suppressed with a documented
#      reason to break that chicken-and-egg dependency, then pinned for
#      real and had that suppression removed the moment a real run
#      produced their true SHAs.

name: secure-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: secure-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-scans:
    name: Secrets, SAST, IaC scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout (full history — Gitleaks needs it to scan past commits)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Gitleaks — scan for committed secrets
        if: always()   # <- this line is the actual fix. Without it, if an earlier
                        #    step in this job fails, GitHub skips every step after
                        #    it by default -- this scan would never even run.
        run: |
          set +e
          docker run --rm -v "$(pwd):/repo" -w /repo ghcr.io/gitleaks/gitleaks:latest \
            detect \
              --source /repo \
              --report-format sarif \
              --report-path /repo/gitleaks.sarif \
              --redact \
              --verbose
          GITLEAKS_EXIT=$?
          set -e
          exit $GITLEAKS_EXIT

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: gitleaks.sarif

      - name: Semgrep — SAST
        if: always()   # <- same reason as Gitleaks above: without this, Gitleaks
                        #    failing would silently skip Semgrep and Checkov too
        run: |
          set +e
          docker run --rm -v "$(pwd):/src" -w /src semgrep/semgrep \
            semgrep scan . \
              --config=p/security-audit \
              --config=p/secrets \
              --config=p/owasp-top-ten \
              --sarif --output=semgrep.sarif \
              --error
          SEMGREP_EXIT=$?
          set -e
          exit $SEMGREP_EXIT

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: semgrep.sarif

      - name: Checkov — IaC scan (all of Segment 1's Terraform, including bootstrap/ and ci-cd-iam.tf)
        if: always()   # <- THIS is the line that fixes what you actually saw:
                        #    Semgrep failed, and without this, Checkov never got
                        #    a chance to run at all -- hence no checkov-output/
        run: |
          set +e
          mkdir -p checkov-output
          docker run --rm -v "$(pwd):/work" -w /work bridgecrew/checkov \
            -d segment1-containerize/terraform \
            --framework terraform \
            --download-external-modules true \
            --config-file .checkov.yaml \
            -o sarif \
            --output-file-path checkov-output
          CHECKOV_EXIT=$?
          set -e
          # Don't guess Checkov's exact output filename (that guess was wrong
          # twice already -- a known Checkov bug means its own log message
          # claims one filename while writing a different one to disk).
          # Instead, find whatever .sarif file actually exists and use that.
          FOUND_SARIF=$(find checkov-output -name "*.sarif" 2>/dev/null | head -n1)
          if [ -n "$FOUND_SARIF" ]; then
            cp "$FOUND_SARIF" checkov.sarif
            echo "Found and copied: $FOUND_SARIF"
          else
            echo "::warning::No .sarif file found under checkov-output/ -- see the listing below for what Checkov actually wrote"
            ls -la checkov-output/ 2>/dev/null || echo "checkov-output/ doesn't even exist -- Checkov may have failed before producing any output at all"
          fi
          exit $CHECKOV_EXIT

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: checkov.sarif

  # -----------------------------------------------------------------------
  # STEP 2 OF 3 -- build, scan, push, sign.
  #
  # Gated to `push` on main only -- a PR (including from a fork) never
  # reaches this job, so it never sees AWS credentials or a signing
  # identity. This matches the build role's own trust condition
  # (ref:refs/heads/main).
  #
  # Deliberately NOT using Step 1's exit-code-capture pattern here. There,
  # we wanted one scanner's failure to never skip the others. Here, we
  # want the opposite: if Trivy finds a real CRITICAL/HIGH, GitHub's
  # default behavior (skip everything after) is exactly correct -- an
  # image that failed its scan must never reach Push or Sign.
  #
  # Signs the image DIGEST, not the tag, after pushing -- a tag is a
  # mutable pointer; someone could re-push different content under the
  # same tag later and the old signature would say nothing about what's
  # there now. The digest is what was actually scanned.
  # -----------------------------------------------------------------------
  build-scan-sign-push:
    name: Build, scan, push, sign image
    needs: static-scans
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # needed for both AWS OIDC (build role) and Cosign keyless (Sigstore) OIDC
      security-events: write
    outputs:
      image_digest: ${{ steps.digest.outputs.image_digest }}
      # Exposed so the deploy job can verify the exact signed artifact by
      # digest, rather than re-deriving or assuming it.
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Assume AWS role via OIDC (build role -- ECR push only, nothing else)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::411714852651:role/segment1-app-gha-build
          aws-region: ap-southeast-1

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build image (not pushed yet)
        id: build
        run: |
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_REF="${{ steps.ecr-login.outputs.registry }}/segment1-app:${IMAGE_TAG}"
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            -t "${IMAGE_REF}" \
            segment1-containerize/app
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          # NOTE: --provenance=false is intentional, not an oversight -- it
          # matches a real, already-documented problem in Segment 1's own
          # DEPLOY.md (default provenance wraps the image in an OCI index
          # some container runtimes don't pull cleanly). Worth revisiting
          # in Segment 2's own architecture-decisions.md, since disabling
          # provenance is a real trade-off against a genuine best practice,
          # not a free win.

      - name: Trivy — scan the built image before it ever reaches the registry
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd):/out" \
            aquasec/trivy:latest \
            image \
              --format sarif \
              --output /out/trivy.sarif \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              "${{ steps.build.outputs.image_ref }}"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy.sarif

      - name: Push image
        run: docker push "${{ steps.build.outputs.image_ref }}"

      - name: Resolve the pushed image's digest
        id: digest
        run: |
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.build.outputs.image_ref }}")
          echo "image_digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Resolved digest: ${IMAGE_DIGEST}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image by digest — keyless, via this workflow's own GitHub OIDC identity
        run: cosign sign --yes "${{ steps.digest.outputs.image_digest }}"

  # -----------------------------------------------------------------------
  # STEP 3 OF 3 -- deploy.
  #
  # Deliberately app-layer only -- no `terraform apply` here. Everything
  # built tonight relied on reading a real `plan` before ever applying;
  # automating infrastructure changes on every push with no human in the
  # loop would throw that discipline away. Infra changes stay on the
  # same manual plan-then-apply workflow used throughout this project.
  # This job only touches the application: image + Helm release.
  #
  # Verifies by DIGEST (the exact thing Step 2 signed), deploys by TAG
  # (github.sha) -- not an inconsistency, a deliberate distinction. The
  # digest is what a signature is actually about. The tag is safe to
  # deploy with specifically because ecr.tf enforces
  # image_tag_mutability = IMMUTABLE, so it can never point anywhere
  # else -- and using it avoids needing to change the Helm chart's
  # template to support digest-style (@sha256:...) image references.
  #
  # Namespace is hardcoded to `default` -- not a preference, a hard
  # constraint: the deploy role's AmazonEKSEditPolicy access entry
  # (ci-cd-iam.tf) is scoped to exactly that namespace. Deploying
  # anywhere else would fail on permissions, not just be non-default.
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy to EKS
    needs: build-scan-sign-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # <- required: the deploy role's trust policy
                               #    only allows AssumeRoleWithWebIdentity
                               #    when this exact GitHub Environment claim
                               #    is present in the OIDC token.
    permissions:
      contents: read
      id-token: write   # needed for AWS OIDC (deploy role)
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Assume AWS role via OIDC (deploy role -- environment-scoped)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::411714852651:role/segment1-app-gha-deploy
          aws-region: ap-southeast-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ap-southeast-1 --name segment1-app-cluster

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Verify the image signature before deploying anything
        run: |
          cosign verify \
            --certificate-identity "https://github.com/i-am-jeffrey/aws-devops-portfolio/.github/workflows/secure-ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ needs.build-scan-sign-push.outputs.image_digest }}"
          # If this fails, the job stops here -- Helm never runs. An
          # unverified image must never reach the cluster, regardless of
          # how it got into ECR.

      - name: Deploy with Helm
        run: |
          helm upgrade --install segment1-app segment1-containerize/helm/segment1-app \
            --namespace default \
            --set image.repository=411714852651.dkr.ecr.ap-southeast-1.amazonaws.com/segment1-app \
            --set image.tag=${{ github.sha }} \
            --atomic \
            --wait \
            --timeout 5m \
            --history-max 5
          # --atomic: auto-rolls back to the previous release if this fails
          #   (implies --wait on its own, but --wait is kept explicit here
          #   for clarity).
          # --timeout 5m: stops this hanging forever if pods never become
          #   ready, rather than blocking the pipeline indefinitely.
          # --history-max 5: caps release history growth -- otherwise it
          #   accumulates forever across every deploy.

      - name: Verify the rollout
        run: |
          kubectl rollout status deployment/segment1-app --namespace default --timeout=60s
          kubectl get pods --namespace default -l app=segment1-app -o wide
