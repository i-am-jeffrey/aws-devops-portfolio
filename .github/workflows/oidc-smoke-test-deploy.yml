# Place this file at: .github/workflows/oidc-smoke-test-deploy.yml
#
# Same pattern as oidc-smoke-test.yml, but proves something different:
# that the ENVIRONMENT-scoped trust condition on segment1-app-gha-deploy
# actually works, not just that OIDC works in general (already proven by
# the build-role test). The `environment: production` line below is not
# decorative -- without it, this job's OIDC token has no "environment:"
# segment in its sub claim at all, and AssumeRoleWithWebIdentity will be
# denied, since the deploy role's trust policy specifically requires that
# claim (see ci-cd-iam.tf's github_actions_deploy_assume).
#
# PREREQUISITE: a GitHub Environment named exactly "production" should
# exist (Settings -> Environments) before running this. If it doesn't,
# GitHub will auto-create a bare one with no protection rules the first
# time this runs -- it'll still pass this test, but it's worth creating
# it deliberately first if you want real reviewer/protection rules later.

name: oidc-smoke-test-deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-deploy-role:
    runs-on: ubuntu-latest
    environment: production   # <- this is the whole point of this test; do not remove it to "simplify"
    steps:
      - name: Assume the deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::411714852651:role/segment1-app-gha-deploy
          aws-region: ap-southeast-1

      - name: Confirm which identity AWS actually granted
        run: aws sts get-caller-identity

      - name: Confirm the deploy role can actually reach EKS (permissions check, not just identity)
        run: aws eks describe-cluster --name segment1-app-cluster --region ap-southeast-1 --query 'cluster.status'
